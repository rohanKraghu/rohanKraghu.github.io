<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Open Graph card: crash course</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  background:#EFF2F0;color:#0F1A17;overflow:hidden;
  font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  display:grid;grid-template-columns:1fr 374px;align-items:center;gap:50px;padding:0 76px;
}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#566B65}
h1{font-weight:600;font-size:54px;line-height:1.08;letter-spacing:-.03em;margin-top:20px}
h1 em{font-style:normal;color:#0E6E5C;font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:.78em;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.chip{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:13px;letter-spacing:.02em;color:#566B65;
  border:1px solid #D3DCD8;padding:8px 14px;border-radius:999px}
.chip.on{border-color:#0E6E5C;color:#0E6E5C;background:#D7E9E3}
.foot{display:flex;align-items:baseline;gap:18px;margin-top:40px;padding-top:24px;border-top:1px solid #D3DCD8}
.name{font-weight:800;font-size:25px;letter-spacing:-.025em}
.url{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:13.5px;color:#566B65}
.tracks{display:flex;flex-direction:column;gap:20px}
.track{border:1px solid #D3DCD8;background:#FFFFFF;padding:28px 26px}
.track .k{display:block;font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#566B65}
.track .t{display:block;margin-top:9px;font-weight:600;font-size:34px;letter-spacing:-.03em;color:#0E6E5C}
.track .s{display:block;margin-top:7px;font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:13px;color:#566B65}
</style></head><body>
<div>
  <div class="eyebrow">A free course from Numeraldo</div>
  <h1>The Financial Literacy<br><em>Crash Course.</em></h1>
  <div class="chips">
    <span class="chip on">16 modules</span>
    <span class="chip">3 calculators</span>
    <span class="chip">No sign-up</span>
    <span class="chip">Printable</span>
  </div>
  <div class="foot"><span class="name">Numeraldo</span><span class="url">rohankraghu.github.io/numeraldo/crash-course</span></div>
</div>
<div class="tracks">
  <div class="track"><span class="k">Track one</span><span class="t">Teens</span><span class="s">Ages 13&ndash;19 &middot; 8 modules</span></div>
  <div class="track"><span class="k">Track two</span><span class="t">Seniors</span><span class="s">Retirement and beyond &middot; 8 modules</span></div>
</div>
</body></html>
