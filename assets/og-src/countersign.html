<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Open Graph card: Countersign</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=ranade@500,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  background:#F3F1EC;color:#16130F;overflow:hidden;
  font-family:Inter,Helvetica,Arial,sans-serif;
  display:grid;grid-template-columns:1fr 454px;align-items:center;gap:54px;padding:0 76px;
}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#6E675C}
h1{font-family:"Ranade","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:82px;line-height:1;letter-spacing:-.04em;margin-top:22px}
.kicker{margin-top:22px;font-size:23px;line-height:1.38;letter-spacing:-.006em;max-width:17.5em}
.foot{display:flex;align-items:baseline;gap:18px;margin-top:42px;padding-top:22px;border-top:1px solid #DCD6CB}
.name{font-family:"Ranade","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em}
.url{font-size:15.5px;color:#6E675C}
.trace{border:1px solid #DCD6CB;background:rgba(22,19,15,.025)}
.cap{font-size:11px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:#6E675C;padding:16px 22px;border-bottom:1px solid #DCD6CB}
.r{display:grid;grid-template-columns:72px 1fr auto;align-items:baseline;gap:14px;padding:19px 22px;border-bottom:1px solid #DCD6CB}
.r:last-child{border-bottom:0}
.k{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#6E675C}
.c{font-size:16.5px;font-weight:500}
.d{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.bk{color:#8A4B2A}
.hd{color:#9A6B12}
</style></head><body>
<div>
  <div class="eyebrow">Security for AI agents that move money</div>
  <h1>Countersign</h1>
  <p class="kicker">A second signature on every move an AI agent makes with money.</p>
  <div class="foot"><span class="name">Rohan Raghu</span><span class="url">rohankraghu.github.io/countersign</span></div>
</div>
<div class="trace">
  <div class="cap">One session, three decisions</div>
  <div class="r"><span class="k">Read</span><span class="c">invoice_0418.pdf</span><span class="d bk">Injection</span></div>
  <div class="r"><span class="k">Action</span><span class="c">update_payee(V-104)</span><span class="d hd">Hold</span></div>
  <div class="r"><span class="k">Action</span><span class="c">pay_invoice(V-104)</span><span class="d bk">Block</span></div>
</div>
</body></html>
