<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Open Graph card: home</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=ranade@500,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  background:#F3F1EC;color:#16130F;overflow:hidden;
  font-family:Inter,Helvetica,Arial,sans-serif;
  display:grid;grid-template-columns:1fr 396px;align-items:center;
  gap:36px;padding:0 76px;
}
.eyebrow{font-size:15.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#6E675C}
h1{
  font-family:"Ranade","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:66px;line-height:1.02;white-space:nowrap;
  letter-spacing:-.035em;margin-top:24px;
}
h1 span{color:#8A4B2A}
.foot{
  display:flex;align-items:baseline;gap:20px;
  margin-top:42px;padding-top:24px;border-top:1px solid #DCD6CB;
}
.name{font-family:"Ranade","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:25px;letter-spacing:-.02em}
.url{font-size:16.5px;color:#6E675C;letter-spacing:.01em}
.art{position:relative;height:520px}
canvas{
  position:absolute;inset:0;width:100%;height:100%;opacity:.7;
  -webkit-mask-image:radial-gradient(ellipse 70% 72% at 50% 50%,#000 58%,transparent 100%);
          mask-image:radial-gradient(ellipse 70% 72% at 50% 50%,#000 58%,transparent 100%);
}
</style></head><body>
<div>
  <div class="eyebrow">Mathematics &amp; artificial intelligence</div>
  <h1>Making numbers<br>mean something</h1>
  <div class="foot"><span class="name">Rohan Raghu</span><span class="url">rohankraghu.github.io</span></div>
</div>
<div class="art"><canvas id="lz" width="792" height="1040"></canvas></div>
<script>
(function(){
  var c=document.getElementById('lz'),x=c.getContext('2d');
  var W=c.width,H=c.height, sg=10, rh=28, bt=8/3, DT=0.004;
  var px=0.9, py=1.0, pz=rh-1;
  var xSpan=0.72*rh+16, zSpan=1.25*rh+8;
  var scale=Math.min(W/xSpan,H/zSpan)*0.94, zMid=rh-3, ox=W/2, oy=H/2;
  function tx(v){return ox+v*scale} function ty(v){return oy-(v-zMid)*scale}
  function rk4(){
    var d=DT,h=d/2;
    var a1=sg*(py-px),b1=px*(rh-pz)-py,c1=px*py-bt*pz;
    var ax=px+h*a1,ay=py+h*b1,az=pz+h*c1;
    var a2=sg*(ay-ax),b2=ax*(rh-az)-ay,c2=ax*ay-bt*az;
    var bx=px+h*a2,by=py+h*b2,bz=pz+h*c2;
    var a3=sg*(by-bx),b3=bx*(rh-bz)-by,c3=bx*by-bt*bz;
    var cx=px+d*a3,cy=py+d*b3,cz=pz+d*c3;
    var a4=sg*(cy-cx),b4=cx*(rh-cz)-cy,c4=cx*cy-bt*cz;
    px+=d/6*(a1+2*a2+2*a3+a4); py+=d/6*(b1+2*b2+2*b3+b4); pz+=d/6*(c1+2*c2+2*c3+c4);
  }
  x.lineWidth=1.9; x.lineJoin=x.lineCap='round'; x.strokeStyle='#8A4B2A';
  for(var band=0;band<5;band++){
    x.globalAlpha=[0.16,0.26,0.40,0.60,0.92][band];
    x.beginPath(); x.moveTo(tx(px),ty(pz));
    for(var i=0;i<6000;i++){ rk4(); x.lineTo(tx(px),ty(pz)); }
    x.stroke();
  }
})();
</script></body></html>
