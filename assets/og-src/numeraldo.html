<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Open Graph card: Numeraldo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  background:#EFF2F0;color:#0F1A17;overflow:hidden;
  font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  display:grid;grid-template-columns:1fr 374px;align-items:center;gap:50px;padding:0 76px;
}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#566B65}
h1{font-weight:600;font-size:50px;line-height:1.08;letter-spacing:-.03em;margin-top:20px}
h1 em{font-style:normal;color:#0E6E5C;font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:.82em;letter-spacing:-.01em}
.foot{display:flex;align-items:baseline;gap:18px;margin-top:44px;padding-top:24px;border-top:1px solid #D3DCD8}
.name{font-weight:800;font-size:25px;letter-spacing:-.025em}
.url{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:15px;color:#566B65}
.ledger{border:1px solid #D3DCD8;background:#FFFFFF;padding:6px 28px}
.row{padding:24px 0;border-bottom:1px solid #D3DCD8}
.row:last-child{border-bottom:0}
.k{display:block;font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#566B65}
.v{display:block;margin-top:8px;font-weight:600;font-size:40px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.v.hl{color:#0E6E5C}
</style></head><body>
<div>
  <div class="eyebrow">Numeracy education &middot; 501(c)(3) nonprofit</div>
  <h1>Expanding world numeracy<br><em>one number at a time.</em></h1>
  <div class="foot"><span class="name">Numeraldo</span><span class="url">rohankraghu.github.io/numeraldo</span></div>
</div>
<div class="ledger">
  <div class="row"><span class="k">Raised to date</span><span class="v hl">$14,250</span></div>
  <div class="row"><span class="k">Students taught weekly</span><span class="v">40+</span></div>
  <div class="row"><span class="k">Partner organizations</span><span class="v">3</span></div>
</div>
</body></html>
